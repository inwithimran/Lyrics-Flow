<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lyrics Flow Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #00f2ff;
            --neon-dim: rgba(0, 242, 255, 0.2);
            --bg-deep: #020406;
        }

        body {
            background-color: var(--bg-deep);
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            transition: background-color 0.5s ease;
        }

        /* Cyberpunk Background Grid */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image: 
                radial-gradient(circle at 50% 50%, #0a1921 0%, transparent 100%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 35px 35px, 35px 35px;
            z-index: -1;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Performance Optimized Lyrics Container */
        #p-lyrics-container {
            flex-grow: 1;
            width: 100%;
            overflow: hidden;
            position: relative;
            z-index: 10;
            mask-image: linear-gradient(to bottom, transparent 0%, black 25%, black 75%, transparent 100%);
        }

        #p-lyrics-scroller {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            will-change: transform;
            transition: transform 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .preview-line {
            transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), color 0.6s ease;
            opacity: 0.15;
            transform: scale(0.85);
            text-align: center;
            margin: 0;
            padding: 24px 40px;
            width: 100%;
            font-size: 1.85rem;
            line-height: 1.2;
            font-weight: 700;
            color: #fff;
            will-change: transform, opacity;
        }

        .preview-line.active {
            opacity: 1;
            transform: scale(1.1);
            color: var(--neon);
            text-shadow: 0 0 25px var(--neon-dim);
        }

        /* Controls Panel */
        .glass-footer {
            background: rgba(10, 15, 20, 0.85);
            backdrop-filter: blur(25px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 40px 40px 0 0;
            z-index: 50;
        }

        .neon-btn {
            background: var(--neon);
            color: #000;
            box-shadow: 0 0 20px var(--neon-dim);
            transition: all 0.2s;
        }

        #progress-slider {
            -webkit-appearance: none;
            width: 100%;
            background: rgba(255,255,255,0.05);
            height: 4px;
            border-radius: 2px;
            overflow: hidden;
        }

        #progress-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 0;
            box-shadow: -100vw 0 0 100vw var(--neon);
        }

        /* Visualizer Canvas */
        #p-viz {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0.4;
            pointer-events: none;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(15px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            transition: opacity 0.3s ease;
        }

        .cyber-panel {
            background: rgba(10, 15, 20, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .theme-dot {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            cursor: pointer;
            border: 3px solid transparent;
            transition: transform 0.2s, border-color 0.2s;
        }
        .theme-dot.active {
            border-color: white;
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <canvas id="p-viz"></canvas>

    <header class="p-8 flex justify-between items-center z-20">
        <div class="space-y-1">
            <h1 class="text-[10px] font-black uppercase tracking-[0.5em] text-white/40" id="theme-tag">Studio Flow</h1>
            <p id="song-title" class="text-xl font-bold truncate max-w-[200px] text-white/90">Ready to sync</p>
        </div>
        <button id="config-btn" class="w-12 h-12 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center text-white/80 active:scale-90 transition-transform">
            <i class="fa-solid fa-gear"></i>
        </button>
    </header>

    <main id="p-lyrics-container">
        <div id="p-lyrics-scroller">
            <div class="preview-line">Load your media to begin</div>
        </div>
    </main>

    <footer class="glass-footer p-8 pb-12">
        <div class="max-w-md mx-auto space-y-6">
            <div class="space-y-3">
                <input type="range" id="progress-slider" value="0" step="0.1">
                <div class="flex justify-between text-[10px] font-bold opacity-40 tracking-widest uppercase mono">
                    <span id="current-time">00:00.00</span>
                    <span id="duration-time">00:00.00</span>
                </div>
            </div>

            <div class="flex items-center justify-between px-4">
                <button class="text-white/30 hover:text-white" onclick="audio.currentTime -= 5"><i class="fa-solid fa-backward-step text-2xl"></i></button>
                
                <button id="play-pause" class="w-20 h-20 bg-white text-black rounded-full flex items-center justify-center shadow-2xl transition-transform active:scale-90">
                    <i id="play-icon" class="fa-solid fa-play text-3xl ml-1"></i>
                    <i id="pause-icon" class="fa-solid fa-pause text-3xl hidden"></i>
                </button>

                <button class="text-white/30 hover:text-white" onclick="audio.currentTime += 5"><i class="fa-solid fa-forward-step text-2xl"></i></button>
            </div>
        </div>
    </footer>

    <!-- Settings/Setup Modal -->
    <div id="setup-modal" class="modal-overlay">
        <div class="cyber-panel space-y-8">
            <div class="text-center">
                <h2 class="text-3xl font-bold tracking-tighter text-white">STUDIO SETTINGS</h2>
                <p class="text-white/30 text-[10px] uppercase tracking-widest mt-1">Configure your experience</p>
            </div>
            
            <div class="space-y-6">
                <!-- Media Section -->
                <div class="space-y-3">
                    <p class="text-[10px] font-bold text-white/40 uppercase tracking-widest ml-1">Media Files</p>
                    <label class="block cursor-pointer bg-white/5 border border-white/10 p-4 rounded-2xl hover:bg-white/10 transition-all">
                        <input type="file" id="audio-input" accept="audio/*" class="hidden">
                        <div class="flex items-center gap-4">
                            <i class="fa-solid fa-music text-white/50"></i>
                            <span id="audio-label" class="text-sm font-bold opacity-70">Load Song</span>
                        </div>
                    </label>

                    <label class="block cursor-pointer bg-white/5 border border-white/10 p-4 rounded-2xl hover:bg-white/10 transition-all">
                        <input type="file" id="lrc-input" accept=".lrc,.txt" class="hidden">
                        <div class="flex items-center gap-4">
                            <i class="fa-solid fa-file-lines text-white/50"></i>
                            <span id="lrc-label" class="text-sm font-bold opacity-70">Load LRC File</span>
                        </div>
                    </label>
                </div>

                <!-- Theme Section -->
                <div class="space-y-3">
                    <p class="text-[10px] font-bold text-white/40 uppercase tracking-widest ml-1">Theme Color</p>
                    <div class="flex justify-between gap-2" id="theme-selector">
                        <div class="theme-dot active" style="background: #00f2ff;" data-color="#00f2ff" data-dim="rgba(0, 242, 255, 0.2)" data-name="CYBER CYAN"></div>
                        <div class="theme-dot" style="background: #a855f7;" data-color="#a855f7" data-dim="rgba(168, 85, 247, 0.2)" data-name="PLASMA PURPLE"></div>
                        <div class="theme-dot" style="background: #f97316;" data-color="#f97316" data-dim="rgba(249, 115, 22, 0.2)" data-name="SUNSET ORANGE"></div>
                        <div class="theme-dot" style="background: #22c55e;" data-color="#22c55e" data-dim="rgba(34, 197, 94, 0.2)" data-name="MATRIX GREEN"></div>
                        <div class="theme-dot" style="background: #ef4444;" data-color="#ef4444" data-dim="rgba(239, 68, 68, 0.2)" data-name="NEON RED"></div>
                    </div>
                </div>
            </div>

            <button id="start-btn" class="w-full py-5 neon-btn font-black rounded-2xl uppercase tracking-widest text-sm">Apply & Close</button>
        </div>
    </div>

    <audio id="audio-player" crossorigin="anonymous"></audio>

    <script>
        const audio = document.getElementById('audio-player');
        const scroller = document.getElementById('p-lyrics-scroller');
        const container = document.getElementById('p-lyrics-container');
        const playPauseBtn = document.getElementById('play-pause');
        const progressSlider = document.getElementById('progress-slider');
        const setupModal = document.getElementById('setup-modal');
        const canvas = document.getElementById('p-viz');
        const ctx = canvas.getContext('2d');
        const themeDots = document.querySelectorAll('.theme-dot');
        const themeTag = document.getElementById('theme-tag');

        let lyrics = [];
        let activeIndex = -1;
        let audioCtx, analyzer, dataArray;
        let currentThemeColor = "#00f2ff";

        // Theme Logic
        themeDots.forEach(dot => {
            dot.onclick = () => {
                themeDots.forEach(d => d.classList.remove('active'));
                dot.classList.add('active');
                
                const color = dot.dataset.color;
                const dim = dot.dataset.dim;
                const name = dot.dataset.name;
                
                document.documentElement.style.setProperty('--neon', color);
                document.documentElement.style.setProperty('--neon-dim', dim);
                currentThemeColor = color;
                themeTag.innerText = name;
                themeTag.style.color = color;
            };
        });

        function initCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
        }
        window.onresize = initCanvas;
        initCanvas();

        async function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyzer = audioCtx.createAnalyser();
            const source = audioCtx.createMediaElementSource(audio);
            source.connect(analyzer);
            analyzer.connect(audioCtx.destination);
            analyzer.fftSize = 128;
            dataArray = new Uint8Array(analyzer.frequencyBinCount);
            drawViz();
        }

        function drawViz() {
            requestAnimationFrame(drawViz);
            analyzer.getByteFrequencyData(dataArray);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const barWidth = (window.innerWidth / dataArray.length) * 2.5;
            for(let i = 0; i < dataArray.length; i++) {
                const h = (dataArray[i] / 255) * 150;
                ctx.fillStyle = currentThemeColor;
                ctx.globalAlpha = dataArray[i]/800;
                ctx.fillRect(i * barWidth, 0, barWidth - 2, h);
                ctx.fillRect(i * barWidth, window.innerHeight - h, barWidth - 2, h);
            }
            ctx.globalAlpha = 1;
        }

        document.getElementById('audio-input').onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                audio.src = URL.createObjectURL(file);
                document.getElementById('song-title').innerText = file.name.replace(/\.[^/.]+$/, "");
                document.getElementById('audio-label').innerText = "✓ Audio Ready";
            }
        };

        document.getElementById('lrc-input').onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => parseLRC(ev.target.result);
                reader.readAsText(file);
                document.getElementById('lrc-label').innerText = "✓ LRC Ready";
            }
        };

        function parseLRC(text) {
            lyrics = [];
            const timeReg = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/g;
            text.split('\n').forEach(line => {
                const times = line.match(timeReg);
                const content = line.replace(timeReg, '').trim();
                if (times && content) {
                    times.forEach(t => {
                        const p = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/.exec(t);
                        const ms = p[3].length === 2 ? parseInt(p[3])*10 : parseInt(p[3]);
                        lyrics.push({ time: parseInt(p[1])*60 + parseInt(p[2]) + ms/1000, content });
                    });
                }
            });
            lyrics.sort((a, b) => a.time - b.time);
            renderPreview();
        }

        function renderPreview() {
            scroller.innerHTML = '';
            lyrics.forEach((l, i) => {
                const div = document.createElement('div');
                div.className = 'preview-line';
                div.id = `line-${i}`;
                div.innerText = l.content;
                scroller.appendChild(div);
            });
            updateScroll(-1);
        }

        document.getElementById('start-btn').onclick = async () => {
            setupModal.style.opacity = '0';
            setTimeout(() => setupModal.classList.add('hidden'), 300);
            if (audio.src) {
                await initAudio();
                if (audio.paused) audio.play();
            }
        };

        playPauseBtn.onclick = () => audio.paused ? audio.play() : audio.pause();

        audio.onplay = () => {
            document.getElementById('play-icon').classList.add('hidden');
            document.getElementById('pause-icon').classList.remove('hidden');
        };

        audio.onpause = () => {
            document.getElementById('play-icon').classList.remove('hidden');
            document.getElementById('pause-icon').classList.add('hidden');
        };

        audio.ontimeupdate = () => {
            const cur = audio.currentTime;
            document.getElementById('current-time').innerText = formatTime(cur);
            progressSlider.value = (cur / audio.duration) * 100 || 0;

            let idx = -1;
            for (let i = 0; i < lyrics.length; i++) {
                if (cur >= lyrics[i].time - 0.1) idx = i;
                else break;
            }

            if (idx !== activeIndex) {
                activeIndex = idx;
                updateScroll(idx);
            }
        };

        function updateScroll(idx) {
            const lines = document.querySelectorAll('.preview-line');
            lines.forEach(el => el.classList.remove('active'));

            if (idx === -1) {
                scroller.style.transform = `translateY(${container.offsetHeight / 2}px)`;
                return;
            }

            const target = document.getElementById(`line-${idx}`);
            if (target) {
                target.classList.add('active');
                const offset = (container.offsetHeight / 2) - (target.offsetTop + target.offsetHeight / 2);
                scroller.style.transform = `translateY(${offset}px)`;
            }
        }

        audio.onloadedmetadata = () => document.getElementById('duration-time').innerText = formatTime(audio.duration);
        progressSlider.oninput = (e) => audio.currentTime = (e.target.value / 100) * audio.duration;
        document.getElementById('config-btn').onclick = () => {
            setupModal.classList.remove('hidden');
            setupModal.style.opacity = '1';
        };

        function formatTime(s) {
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            const ms = Math.floor((s % 1) * 100);
            return `${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}.${ms.toString().padStart(2, '0')}`;
        }
    </script>
</body>
</html>
