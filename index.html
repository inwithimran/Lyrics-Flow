<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lyrics Flow Pro - Studio Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00f2ff;
            --accent-glow: rgba(0, 242, 255, 0.2);
            --bg-base: #030712;
            --card-bg: rgba(15, 23, 42, 0.85);
            --viz-opacity: 0.65;
        }

        html, body {
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-base);
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Ambient Background Grid */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(15, 23, 42, 0.95) 0%, transparent 85%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            z-index: -1;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Full Overlay Canvas for Center Galaxy Visualizer */
        #p-viz-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.20;
            transition: opacity 0.4s ease;
        }

        /* Dedicated Visualizer Strip Above Controls for Soft Bars */
        #viz-wrapper {
            width: 100%;
            height: 65px;
            pointer-events: none;
            z-index: 25;
            flex-shrink: 0;
            margin-bottom: -15px;
            position: relative;
        }

        #p-viz-bar {
            width: 100%;
            height: 100%;
            opacity: var(--viz-opacity);
            transition: opacity 0.4s ease;
        }

        /* Lyrics Viewport Container */
        #p-lyrics-container {
            flex: 1 1 0%;
            min-height: 0;
            width: 100%;
            overflow: hidden;
            position: relative;
            z-index: 10;
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
        }

        #p-lyrics-scroller {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            will-change: transform;
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .preview-line {
            transition: all 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0.25;
            transform: scale(0.88);
            text-align: center;
            margin: 0;
            padding: 16px 24px;
            width: 100%;
            font-size: 1.45rem;
            line-height: 1.4;
            font-weight: 700;
            color: #94a3b8;
            will-change: transform, opacity;
            word-wrap: break-word;
            cursor: pointer;
            border-radius: 16px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .preview-line:hover {
            opacity: 0.6;
            color: #f8fafc;
        }

        @media (min-width: 640px) {
            .preview-line {
                font-size: 2.1rem;
                padding: 22px 40px;
            }
            #viz-wrapper {
                height: 85px;
            }
        }

        .preview-line.active {
            opacity: 1;
            transform: scale(1.08);
            color: var(--accent);
            text-shadow: 0 0 20px var(--accent-glow), 0 4px 15px rgba(0,0,0,0.9);
        }

        /* Glassmorphism Panels */
        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-footer {
            background: rgba(8, 12, 22, 0.94);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px 32px 0 0;
            z-index: 40;
            flex-shrink: 0;
            padding-bottom: max(1.25rem, env(safe-area-inset-bottom));
        }

        /* Buttons */
        .btn-accent {
            background: var(--accent);
            color: #030712;
            box-shadow: 0 0 20px var(--accent-glow);
            transition: all 0.2s ease;
        }

        .btn-accent:active {
            transform: scale(0.92);
        }

        /* Progress Slider */
        .custom-slider {
            -webkit-appearance: none;
            width: 100%;
            background: rgba(255,255,255,0.1);
            height: 6px;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
            transition: height 0.2s;
        }

        .custom-slider:hover {
            height: 8px;
        }

        .custom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 12px var(--accent);
            cursor: pointer;
        }

        /* Spinning Vinyl Record */
        .vinyl-record {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: radial-gradient(circle, #000 30%, #1e293b 31%, #0f172a 60%, #000 100%);
            border: 2px solid rgba(255,255,255,0.12);
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            animation: spin 8s linear infinite;
            animation-play-state: paused;
        }

        .vinyl-record.playing {
            animation-play-state: running;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: opacity 0.3s ease;
        }

        .theme-dot {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            cursor: pointer;
            border: 2.5px solid transparent;
            transition: transform 0.2s, border-color 0.2s;
        }
        .theme-dot.active {
            border-color: #ffffff;
            transform: scale(1.1);
        }

        /* 2-Tab Navigation Styling */
        .tab-btn {
            position: relative;
            padding: 10px 14px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
            transition: all 0.2s ease;
            border-bottom: 2px solid transparent;
            width: 50%;
            text-align: center;
        }
        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            background: rgba(255, 255, 255, 0.03);
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
    </style>
</head>
<body>

    <div class="bg-grid"></div>

    <!-- Center Galaxy Visualizer Canvas (Background behind lyrics) -->
    <canvas id="p-viz-bg"></canvas>

    <!-- Header Area -->
    <header class="p-4 sm:p-6 flex justify-between items-center z-20 flex-shrink-0">
        <div class="flex items-center gap-3">
            <div id="vinyl-art" class="vinyl-record flex items-center justify-center">
                <div class="w-3 h-3 rounded-full bg-white/20"></div>
            </div>
            <div class="space-y-0.5 max-w-[180px] sm:max-w-[300px]">
                <div class="flex items-center gap-2">
                    <span id="theme-tag" class="text-[9px] font-black uppercase tracking-[0.3em] text-white/40">CYBER CYAN</span>
                    <span id="offset-badge" class="text-[9px] mono px-1.5 py-0.5 rounded bg-white/10 text-white/60">0.0s</span>
                </div>
                <h1 id="song-title" class="text-base sm:text-lg font-bold truncate text-white/90">No Track Loaded</h1>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <!-- Search Button -->
            <button id="search-btn" class="w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-white/70 hover:text-white active:scale-90 transition-transform">
                <i class="fa-solid fa-magnifying-glass text-sm"></i>
            </button>
            <!-- Settings Button -->
            <button id="config-btn" class="w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-white/70 hover:text-white active:scale-90 transition-transform">
                <i class="fa-solid fa-sliders text-sm"></i>
            </button>
        </div>
    </header>

    <!-- Search Bar Box -->
    <div id="search-bar-container" class="px-6 hidden z-20 flex-shrink-0 mb-2">
        <div class="glass-panel rounded-xl flex items-center px-3 py-2 border border-white/10">
            <i class="fa-solid fa-search text-white/40 text-xs mr-2"></i>
            <input type="text" id="lyrics-search-input" placeholder="Search lyrics..." class="bg-transparent text-xs text-white outline-none w-full">
            <button id="close-search" class="text-white/40 text-xs px-2"><i class="fa-solid fa-xmark"></i></button>
        </div>
    </div>

    <!-- Lyrics Viewport Area -->
    <main id="p-lyrics-container">
        <div id="p-lyrics-scroller">
            <div class="preview-line">Load audio & lyrics file to start</div>
        </div>
    </main>

    <!-- Dedicated Visualizer Strip for Soft Bars (Above Controls) -->
    <div id="viz-wrapper">
        <canvas id="p-viz-bar"></canvas>
    </div>

    <!-- Control Footer -->
    <footer class="glass-footer p-4 sm:p-6">
        <div class="max-w-md mx-auto space-y-4">
            <!-- Audio Progress Slider -->
            <div class="space-y-1.5">
                <input type="range" id="progress-slider" class="custom-slider" value="0" step="0.1">
                <div class="flex justify-between text-[10px] font-bold opacity-50 tracking-widest uppercase mono">
                    <span id="current-time">00:00.00</span>
                    <span id="duration-time">00:00.00</span>
                </div>
            </div>

            <!-- Controls Row -->
            <div class="flex items-center justify-between px-2">
                <!-- Loop Track -->
                <button id="loop-btn" class="w-9 h-9 rounded-lg text-white/40 hover:text-white flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-repeat text-sm"></i>
                </button>

                <!-- Rewind 5s -->
                <button id="rewind-btn" class="w-10 h-10 rounded-full text-white/60 hover:text-white active:scale-90 transition-transform flex items-center justify-center">
                    <i class="fa-solid fa-rotate-left text-base"></i>
                </button>
                
                <!-- Play/Pause Button -->
                <button id="play-pause" class="w-16 h-16 sm:w-18 sm:h-18 btn-accent rounded-full flex items-center justify-center shadow-xl active:scale-90 transition-transform">
                    <i id="play-icon" class="fa-solid fa-play text-2xl ml-1"></i>
                    <i id="pause-icon" class="fa-solid fa-pause text-2xl hidden"></i>
                </button>

                <!-- Forward 5s -->
                <button id="forward-btn" class="w-10 h-10 rounded-full text-white/60 hover:text-white active:scale-90 transition-transform flex items-center justify-center">
                    <i class="fa-solid fa-rotate-right text-base"></i>
                </button>

                <!-- Sync Offset Button -->
                <button id="offset-btn" class="w-9 h-9 rounded-lg text-white/40 hover:text-white flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-clock-rotate-left text-sm"></i>
                </button>
            </div>
        </div>
    </footer>

    <!-- Studio Control Modal with Exactly 2 Clean Tabs -->
    <div id="setup-modal" class="modal-overlay hidden opacity-0">
        <div class="cyber-panel glass-panel rounded-3xl p-5 w-full max-w-sm space-y-4 shadow-2xl border border-white/10">
            <!-- Modal Header -->
            <div class="flex justify-between items-center border-b border-white/10 pb-3">
                <h2 class="text-base font-extrabold tracking-tight text-white flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-xs text-cyan-400"></i> STUDIO CONTROL
                </h2>
                <button id="close-modal" class="text-white/40 hover:text-white"><i class="fa-solid fa-xmark text-sm"></i></button>
            </div>
            
            <!-- 2 Tab Options Bar -->
            <div class="flex border-b border-white/10">
                <button class="tab-btn active" data-tab="tab-lyrics-media">
                    <i class="fa-solid fa-music mr-1.5"></i> Lyrics & Media
                </button>
                <button class="tab-btn" data-tab="tab-settings">
                    <i class="fa-solid fa-gear mr-1.5"></i> Preferences
                </button>
            </div>

            <!-- TAB 1: LYRICS & MEDIA -->
            <div id="tab-lyrics-media" class="tab-content space-y-3.5 text-xs">
                <!-- Quick Demo Track Loader -->
                <button id="demo-load-btn" class="w-full py-2.5 px-3 rounded-xl bg-cyan-500/10 border border-cyan-500/30 text-cyan-300 font-bold hover:bg-cyan-500/20 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Load Demo Song & Lyrics
                </button>

                <!-- Audio File Selector -->
                <div class="space-y-1.5">
                    <p class="font-bold text-white/40 uppercase tracking-wider text-[9px]">Audio File</p>
                    <label class="block cursor-pointer bg-white/5 border border-white/10 p-2.5 rounded-xl hover:bg-white/10 transition-all">
                        <input type="file" id="audio-input" accept="audio/*" class="hidden">
                        <div class="flex items-center gap-2.5">
                            <i class="fa-solid fa-music text-white/50"></i>
                            <span id="audio-label" class="font-semibold text-white/80 truncate">Choose Audio File</span>
                        </div>
                    </label>
                </div>

                <!-- LRC File Selector -->
                <div class="space-y-1.5">
                    <p class="font-bold text-white/40 uppercase tracking-wider text-[9px]">LRC File</p>
                    <label class="block cursor-pointer bg-white/5 border border-white/10 p-2.5 rounded-xl hover:bg-white/10 transition-all">
                        <input type="file" id="lrc-input" accept=".lrc,.txt" class="hidden">
                        <div class="flex items-center gap-2.5">
                            <i class="fa-solid fa-file-lines text-white/50"></i>
                            <span id="lrc-label" class="font-semibold text-white/80 truncate">Choose LRC File</span>
                        </div>
                    </label>
                </div>

                <!-- Direct Text Lyrics Box -->
                <div class="space-y-1.5">
                    <div class="flex justify-between items-center">
                        <p class="font-bold text-white/40 uppercase tracking-wider text-[9px]">Or Paste / Type Lyrics</p>
                        <button id="clear-text-btn" class="text-[9px] text-white/40 hover:text-white underline">Clear</button>
                    </div>
                    <textarea id="lrc-text-input" rows="3" placeholder="[00:05.00] Paste lyrics here with or without timestamps..." class="w-full bg-white/5 border border-white/10 rounded-xl p-2 text-xs text-white placeholder-white/30 outline-none focus:border-cyan-400 transition-all resize-none mono"></textarea>
                </div>
            </div>

            <!-- TAB 2: SETTINGS & PREFERENCES -->
            <div id="tab-settings" class="tab-content hidden space-y-4 text-xs">
                <!-- Visualizer Style Modes -->
                <div class="space-y-2">
                    <p class="font-bold text-white/40 uppercase tracking-wider text-[9px]">Visualizer Style</p>
                    <div class="flex gap-2">
                        <button class="viz-style-btn flex-1 py-2 rounded-xl bg-white/10 border border-white/20 text-white font-bold text-[10px]" data-style="bars">SOFT BARS</button>
                        <button class="viz-style-btn flex-1 py-2 rounded-xl bg-white/5 text-white/60 font-bold text-[10px]" data-style="circle">GALAXY ORBIT</button>
                        <button class="viz-style-btn flex-1 py-2 rounded-xl bg-white/5 text-white/60 font-bold text-[10px]" data-style="off">OFF</button>
                    </div>
                </div>

                <!-- Playback Speed -->
                <div class="space-y-2">
                    <p class="font-bold text-white/40 uppercase tracking-wider text-[9px]">Playback Speed</p>
                    <div class="flex justify-between gap-1 bg-white/5 p-1 rounded-xl" id="speed-selector">
                        <button class="speed-btn flex-1 py-1 rounded-lg text-white/60 font-bold hover:text-white" data-speed="0.75">0.75x</button>
                        <button class="speed-btn flex-1 py-1 rounded-lg bg-white/10 text-white font-bold" data-speed="1.0">1.0x</button>
                        <button class="speed-btn flex-1 py-1 rounded-lg text-white/60 font-bold hover:text-white" data-speed="1.25">1.25x</button>
                        <button class="speed-btn flex-1 py-1 rounded-lg text-white/60 font-bold hover:text-white" data-speed="1.5">1.5x</button>
                    </div>
                </div>

                <!-- Color Theme -->
                <div class="space-y-2">
                    <p class="font-bold text-white/40 uppercase tracking-wider text-[9px]">Color Theme Preset</p>
                    <div class="flex justify-between gap-2" id="theme-selector">
                        <div class="theme-dot active" style="background: #00f2ff;" data-color="#00f2ff" data-dim="rgba(0, 242, 255, 0.2)" data-name="CYBER CYAN"></div>
                        <div class="theme-dot" style="background: #a855f7;" data-color="#a855f7" data-dim="rgba(168, 85, 247, 0.2)" data-name="PLASMA PURPLE"></div>
                        <div class="theme-dot" style="background: #f97316;" data-color="#f97316" data-dim="rgba(249, 115, 22, 0.2)" data-name="SUNSET ORANGE"></div>
                        <div class="theme-dot" style="background: #22c55e;" data-color="#22c55e" data-dim="rgba(34, 197, 94, 0.2)" data-name="MATRIX GREEN"></div>
                        <div class="theme-dot" style="background: #ef4444;" data-color="#ef4444" data-dim="rgba(239, 68, 68, 0.2)" data-name="NEON RED"></div>
                    </div>
                </div>

                <!-- Reset Default Settings Button -->
                <div class="pt-2 border-t border-white/10">
                    <button id="reset-settings-btn" class="w-full py-2.5 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 font-bold hover:bg-red-500/20 transition-all flex items-center justify-center gap-2 text-[11px]">
                        <i class="fa-solid fa-rotate-left"></i> Reset Default Settings
                    </button>
                </div>
            </div>

            <button id="apply-btn" class="w-full py-3 btn-accent font-black rounded-xl uppercase tracking-wider text-xs mt-1">
                Apply Settings
            </button>
        </div>
    </div>

    <!-- Sync Offset Modal -->
    <div id="offset-modal" class="modal-overlay hidden opacity-0">
        <div class="glass-panel rounded-3xl p-6 w-full max-w-xs space-y-4 text-center border border-white/10">
            <h3 class="font-bold text-sm text-white">Adjust Lyric Sync Offset</h3>
            <p class="text-[11px] text-white/50">Shift lyrics earlier or later to match audio perfectly.</p>
            
            <div class="flex items-center justify-center gap-4 py-2">
                <button id="offset-minus" class="w-10 h-10 rounded-xl bg-white/10 text-white font-bold hover:bg-white/20">-0.1s</button>
                <span id="offset-val" class="mono text-lg font-bold text-cyan-400">0.0s</span>
                <button id="offset-plus" class="w-10 h-10 rounded-xl bg-white/10 text-white font-bold hover:bg-white/20">+0.1s</button>
            </div>

            <button id="offset-reset" class="text-xs text-white/40 hover:text-white underline">Reset Offset</button>
            <button id="close-offset" class="w-full py-2.5 bg-white/10 rounded-xl text-xs font-bold text-white mt-2">Done</button>
        </div>
    </div>

    <audio id="audio-player" crossorigin="anonymous"></audio>

    <script>
        // Core Selectors
        const audio = document.getElementById('audio-player');
        const scroller = document.getElementById('p-lyrics-scroller');
        const container = document.getElementById('p-lyrics-container');
        const playPauseBtn = document.getElementById('play-pause');
        const progressSlider = document.getElementById('progress-slider');
        const setupModal = document.getElementById('setup-modal');
        const offsetModal = document.getElementById('offset-modal');
        const lrcTextInput = document.getElementById('lrc-text-input');
        const clearTextBtn = document.getElementById('clear-text-btn');
        
        const canvasBar = document.getElementById('p-viz-bar');
        const vizWrapper = document.getElementById('viz-wrapper');
        const ctxBar = canvasBar.getContext('2d');

        const canvasBg = document.getElementById('p-viz-bg');
        const ctxBg = canvasBg.getContext('2d');

        const vinylArt = document.getElementById('vinyl-art');
        const offsetBadge = document.getElementById('offset-badge');

        // Defaults Config
        const DEFAULT_PREFERENCES = {
            visualizerMode: 'bars',
            playbackSpeed: 1.0,
            themeName: 'CYBER CYAN',
            themeColor: '#00f2ff',
            themeDim: 'rgba(0, 242, 255, 0.2)',
            timeOffset: 0.0,
            isLooping: false
        };

        // State Engine
        let lyrics = [];
        let activeIndex = -1;
        let audioCtx, analyzer, dataArray;
        let currentThemeColor = DEFAULT_PREFERENCES.themeColor;
        let timeOffset = DEFAULT_PREFERENCES.timeOffset;
        let isLooping = DEFAULT_PREFERENCES.isLooping;
        let visualizerMode = DEFAULT_PREFERENCES.visualizerMode;
        let playbackSpeed = DEFAULT_PREFERENCES.playbackSpeed;
        
        // Smooth Interpolation Array for Visualizer Bars
        const barCount = 32;
        let smoothBars = new Array(barCount).fill(0);

        // Resize Canvas dynamically
        function initCanvas() {
            const dpr = window.devicePixelRatio || 1;
            
            // Bar Canvas Size inside Wrapper
            const rectBar = vizWrapper.getBoundingClientRect();
            canvasBar.width = rectBar.width * dpr;
            canvasBar.height = rectBar.height * dpr;
            ctxBar.scale(dpr, dpr);

            // Background Galaxy Canvas Fullscreen Size
            canvasBg.width = window.innerWidth * dpr;
            canvasBg.height = window.innerHeight * dpr;
            ctxBg.scale(dpr, dpr);
        }
        window.onresize = () => {
            initCanvas();
            updateScroll(activeIndex);
        };
        initCanvas();

        // Audio Context Initializer
        async function initAudio() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyzer = audioCtx.createAnalyser();
                const source = audioCtx.createMediaElementSource(audio);
                source.connect(analyzer);
                analyzer.connect(audioCtx.destination);
                analyzer.fftSize = 128;
                dataArray = new Uint8Array(analyzer.frequencyBinCount);
            } catch (e) {
                console.log("AudioContext fallback:", e);
            }
        }

        // Dual Canvas Rendering Engine
        function drawViz() {
            requestAnimationFrame(drawViz);

            // Clear canvases
            const barRect = vizWrapper.getBoundingClientRect();
            ctxBar.clearRect(0, 0, barRect.width, barRect.height);
            ctxBg.clearRect(0, 0, window.innerWidth, window.innerHeight);

            if (visualizerMode === 'off') {
                vizWrapper.style.display = 'none';
                return;
            }

            let hasRealData = false;
            if (analyzer && !audio.paused) {
                analyzer.getByteFrequencyData(dataArray);
                for(let val of dataArray) {
                    if (val > 0) { hasRealData = true; break; }
                }
            }

            let displayData = new Array(barCount).fill(0);

            if (hasRealData) {
                for(let i = 0; i < barCount; i++) {
                    displayData[i] = dataArray[i] || 0;
                }
            } else if (!audio.paused) {
                const now = Date.now() / 250;
                for (let i = 0; i < barCount; i++) {
                    displayData[i] = (Math.sin(now + i * 0.25) * 0.5 + 0.5) * 140 + 20;
                }
            }

            // Smooth Interpolation
            for(let i = 0; i < barCount; i++) {
                smoothBars[i] += (displayData[i] - smoothBars[i]) * 0.18;
            }

            // 1. SOFT BARS MODE (Anchored Right Above Controls)
            if (visualizerMode === 'bars') {
                vizWrapper.style.display = 'block';
                const width = barRect.width;
                const height = barRect.height;
                const barWidth = (width / barCount) * 0.55;
                const gap = (width / barCount) * 0.45;

                for (let i = 0; i < barCount; i++) {
                    const h = (smoothBars[i] / 255) * (height * 0.85);
                    const x = i * (barWidth + gap) + gap / 2;
                    const y = height - h;

                    const grad = ctxBar.createLinearGradient(0, height, 0, y);
                    grad.addColorStop(0, 'transparent');
                    grad.addColorStop(0.3, currentThemeColor);
                    grad.addColorStop(1, '#ffffff');

                    ctxBar.fillStyle = grad;
                    ctxBar.globalAlpha = 0.9;
                    
                    ctxBar.beginPath();
                    ctxBar.roundRect(x, y, barWidth, h, [4, 4, 0, 0]);
                    ctxBar.fill();
                }
            } 
            // 2. GALAXY ORBIT MODE (Centered behind Lyrics)
            else if (visualizerMode === 'circle') {
                vizWrapper.style.display = 'none';

                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight / 2 - 20; // Center in Lyrics Viewport
                const baseRadius = Math.min(window.innerWidth, window.innerHeight) * 0.18;

                ctxBg.save();
                ctxBg.translate(centerX, centerY);

                for (let i = 0; i < barCount; i++) {
                    const angle = (i / barCount) * Math.PI * 2;
                    const v = smoothBars[i] / 255.0;
                    const h = v * 55; // Orbit height pulse

                    const x1 = Math.cos(angle) * baseRadius;
                    const y1 = Math.sin(angle) * baseRadius;
                    const x2 = Math.cos(angle) * (baseRadius + h);
                    const y2 = Math.sin(angle) * (baseRadius + h);

                    ctxBg.beginPath();
                    ctxBg.moveTo(x1, y1);
                    ctxBg.lineTo(x2, y2);
                    ctxBg.strokeStyle = currentThemeColor;
                    ctxBg.lineWidth = 3.5;
                    ctxBg.lineCap = 'round';
                    ctxBg.globalAlpha = 0.75;
                    ctxBg.stroke();
                }

                // Inner Soft Pulse Disc
                ctxBg.beginPath();
                ctxBg.arc(0, 0, baseRadius - 8, 0, Math.PI * 2);
                ctxBg.fillStyle = currentThemeColor;
                ctxBg.globalAlpha = 0.08;
                ctxBg.fill();

                ctxBg.restore();
            }
            ctxBar.globalAlpha = 1;
            ctxBg.globalAlpha = 1;
        }
        drawViz();

        // LRC Parsing Engine (Supports Timestamped LRC and Plain Text)
        function parseLRC(text) {
            lyrics = [];
            if (!text || !text.trim()) {
                renderPreview();
                return;
            }

            const cleanText = text.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            const lines = cleanText.split('\n');
            const timestampRegex = /[\[<\(]\s*(\d{1,3})\s*:\s*(\d{1,2})(?:\s*[\.\:,]\s*(\d{1,3}))?\s*[\]>\)]/g;

            let hasTimestamps = false;

            lines.forEach((line) => {
                if (/^\s*[\[<\(]\s*(ar|ti|al|by|offset|length)\s*:/i.test(line)) return;

                const matches = [...line.matchAll(timestampRegex)];
                if (matches.length > 0) {
                    hasTimestamps = true;
                    let content = line.replace(timestampRegex, '').trim();
                    if (!content) content = "♪ ♪ ♪";

                    matches.forEach(match => {
                        const min = parseInt(match[1], 10);
                        const sec = parseInt(match[2], 10);
                        let ms = 0;
                        if (match[3]) {
                            const rawMs = match[3];
                            if (rawMs.length === 1) ms = parseInt(rawMs, 10) * 100;
                            else if (rawMs.length === 2) ms = parseInt(rawMs, 10) * 10;
                            else ms = parseInt(rawMs, 10);
                        }
                        const time = min * 60 + sec + ms / 1000;
                        lyrics.push({ time, content });
                    });
                }
            });

            // Fallback for Plain Text Lyrics without Timestamps
            if (!hasTimestamps) {
                const totalLines = lines.filter(l => l.trim() !== '');
                const interval = audio.duration ? audio.duration / totalLines.length : 3;
                let currentTime = 0;
                
                totalLines.forEach((lineText) => {
                    if (lineText.trim()) {
                        lyrics.push({ time: currentTime, content: lineText.trim() });
                        currentTime += interval;
                    }
                });
            }

            lyrics.sort((a, b) => a.time - b.time);
            renderPreview();
        }

        function renderPreview() {
            scroller.innerHTML = '';
            if (lyrics.length === 0) {
                scroller.innerHTML = '<div class="preview-line">No lyrics available</div>';
                updateScroll(-1);
                return;
            }

            lyrics.forEach((l, i) => {
                const div = document.createElement('div');
                div.className = 'preview-line';
                div.id = `line-${i}`;
                div.innerText = l.content;
                
                div.onclick = () => {
                    audio.currentTime = Math.max(0, l.time + timeOffset);
                    if (audio.paused) audio.play();
                };

                scroller.appendChild(div);
            });
            activeIndex = -1;
            updateScroll(-1);
        }

        // High precision 60FPS Lyric Sync Loop
        function syncLyricLoop() {
            if (!audio.paused && !audio.ended) {
                updateLyricPosition();
            }
            requestAnimationFrame(syncLyricLoop);
        }
        requestAnimationFrame(syncLyricLoop);

        function updateLyricPosition() {
            const cur = audio.currentTime;
            document.getElementById('current-time').innerText = formatTime(cur);
            if (audio.duration) {
                progressSlider.value = (cur / audio.duration) * 100;
            }

            const adjustedTime = cur - timeOffset;

            let idx = -1;
            for (let i = 0; i < lyrics.length; i++) {
                if (adjustedTime >= lyrics[i].time - 0.08) {
                    idx = i;
                } else {
                    break;
                }
            }

            if (idx !== activeIndex) {
                activeIndex = idx;
                updateScroll(idx);
            }
        }

        function updateScroll(idx) {
            const lines = document.querySelectorAll('.preview-line');
            lines.forEach(el => el.classList.remove('active'));

            const containerHeight = container.offsetHeight;

            if (idx === -1 || !lines.length) {
                scroller.style.transform = `translateY(${containerHeight / 2}px)`;
                return;
            }

            const target = document.getElementById(`line-${idx}`);
            if (target) {
                target.classList.add('active');
                const offset = (containerHeight / 2) - (target.offsetTop + target.offsetHeight / 2);
                scroller.style.transform = `translateY(${offset}px)`;
            }
        }

        // Helper Function to trigger auto play smoothly
        async function triggerPlay() {
            if (audio.src) {
                await initAudio();
                try {
                    await audio.play();
                } catch (err) {
                    console.log("Autoplay prevented:", err);
                }
            }
        }

        // --- LOCAL STORAGE & PREFERENCES ENGINE ---
        function savePreferences() {
            const activeThemeDot = document.querySelector('.theme-dot.active');
            const prefs = {
                visualizerMode: visualizerMode,
                playbackSpeed: audio.playbackRate || playbackSpeed,
                themeName: activeThemeDot ? activeThemeDot.dataset.name : DEFAULT_PREFERENCES.themeName,
                themeColor: activeThemeDot ? activeThemeDot.dataset.color : DEFAULT_PREFERENCES.themeColor,
                themeDim: activeThemeDot ? activeThemeDot.dataset.dim : DEFAULT_PREFERENCES.themeDim,
                timeOffset: timeOffset,
                isLooping: isLooping
            };
            localStorage.setItem('lyrics_flow_preferences', JSON.stringify(prefs));
        }

        function loadPreferences() {
            const saved = localStorage.getItem('lyrics_flow_preferences');
            let prefs = DEFAULT_PREFERENCES;
            if (saved) {
                try {
                    prefs = { ...DEFAULT_PREFERENCES, ...JSON.parse(saved) };
                } catch (e) {
                    console.error("Error loading saved preferences:", e);
                }
            }
            applyPreferences(prefs);
        }

        function applyPreferences(prefs) {
            // Apply Visualizer Style Mode
            visualizerMode = prefs.visualizerMode;
            document.querySelectorAll('.viz-style-btn').forEach(btn => {
                if (btn.dataset.style === visualizerMode) {
                    btn.classList.add('bg-white/10', 'border', 'border-white/20', 'text-white');
                    btn.classList.remove('bg-white/5', 'text-white/60');
                } else {
                    btn.classList.remove('bg-white/10', 'border', 'border-white/20', 'text-white');
                    btn.classList.add('bg-white/5', 'text-white/60');
                }
            });

            // Apply Playback Speed
            playbackSpeed = prefs.playbackSpeed;
            audio.playbackRate = playbackSpeed;
            document.querySelectorAll('.speed-btn').forEach(btn => {
                if (parseFloat(btn.dataset.speed) === playbackSpeed) {
                    btn.classList.add('bg-white/10', 'text-white');
                    btn.classList.remove('text-white/60');
                } else {
                    btn.classList.remove('bg-white/10', 'text-white');
                    btn.classList.add('text-white/60');
                }
            });

            // Apply Color Theme
            document.querySelectorAll('.theme-dot').forEach(dot => {
                if (dot.dataset.name === prefs.themeName || dot.dataset.color === prefs.themeColor) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
            document.documentElement.style.setProperty('--accent', prefs.themeColor);
            document.documentElement.style.setProperty('--accent-glow', prefs.themeDim);
            currentThemeColor = prefs.themeColor;
            document.getElementById('theme-tag').innerText = prefs.themeName;
            document.getElementById('theme-tag').style.color = prefs.themeColor;

            // Apply Loop State
            isLooping = prefs.isLooping;
            audio.loop = isLooping;
            const loopBtn = document.getElementById('loop-btn');
            loopBtn.style.color = isLooping ? currentThemeColor : 'rgba(255,255,255,0.4)';

            // Apply Time Offset
            timeOffset = prefs.timeOffset;
            updateOffsetUI();
        }

        // Tab Switching Logic (Exact 2 Tabs)
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));

                btn.classList.add('active');
                const targetId = btn.dataset.tab;
                document.getElementById(targetId).classList.remove('hidden');
            };
        });

        // File Input Listeners
        document.getElementById('audio-input').onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                audio.src = URL.createObjectURL(file);
                document.getElementById('song-title').innerText = file.name.replace(/\.[^/.]+$/, "");
                document.getElementById('audio-label').innerText = "✓ " + file.name;
            }
        };

        document.getElementById('lrc-input').onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const content = ev.target.result;
                    lrcTextInput.value = content;
                    parseLRC(content);
                };
                reader.readAsText(file);
                document.getElementById('lrc-label').innerText = "✓ " + file.name;
            }
        };

        // Text Clear Button
        clearTextBtn.onclick = () => {
            lrcTextInput.value = '';
            document.getElementById('lrc-label').innerText = "Choose LRC File";
            parseLRC('');
        };

        // Demo Track Loader
        document.getElementById('demo-load-btn').onclick = async () => {
            audio.src = "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3";
            document.getElementById('song-title').innerText = "Cyber Lofi Chill (Demo)";
            
            const demoLRC = `
[00:00.00] ♪ Soft Ambient Intro ♪
[00:05.00] Welcome to Lyrics Flow Pro Studio
[00:09.50] High precision lyric synchronization
[00:14.00] Elegant and clear typography
[00:19.00] Switch visualizers between soft bars and galaxy orbit
[00:24.00] Optimized for mobile & desktop screens
[00:30.00] ♪ Instrumental Bridge ♪
[00:36.00] Enjoy your music experience!
            `;
            lrcTextInput.value = demoLRC.trim();
            parseLRC(demoLRC);
            closeModals();
            await triggerPlay();
        };

        // Player Actions
        playPauseBtn.onclick = async () => {
            if (!audio.src) {
                openModal(setupModal);
                return;
            }
            if (audio.paused) {
                await triggerPlay();
            } else {
                audio.pause();
            }
        };

        audio.onplay = () => {
            document.getElementById('play-icon').classList.add('hidden');
            document.getElementById('pause-icon').classList.remove('hidden');
            vinylArt.classList.add('playing');
        };

        audio.onpause = () => {
            document.getElementById('play-icon').classList.remove('hidden');
            document.getElementById('pause-icon').classList.add('hidden');
            vinylArt.classList.remove('playing');
        };

        document.getElementById('rewind-btn').onclick = () => audio.currentTime = Math.max(0, audio.currentTime - 5);
        document.getElementById('forward-btn').onclick = () => audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5);

        // Loop Button
        const loopBtn = document.getElementById('loop-btn');
        loopBtn.onclick = () => {
            isLooping = !isLooping;
            audio.loop = isLooping;
            loopBtn.style.color = isLooping ? currentThemeColor : 'rgba(255,255,255,0.4)';
            savePreferences();
        };

        // Sync Offset Controls
        document.getElementById('offset-btn').onclick = () => openModal(offsetModal);
        document.getElementById('close-offset').onclick = () => closeModal(offsetModal);

        document.getElementById('offset-plus').onclick = () => adjustOffset(0.1);
        document.getElementById('offset-minus').onclick = () => adjustOffset(-0.1);
        document.getElementById('offset-reset').onclick = () => {
            timeOffset = 0.0;
            updateOffsetUI();
            savePreferences();
        };

        function adjustOffset(val) {
            timeOffset += val;
            updateOffsetUI();
            savePreferences();
        }

        function updateOffsetUI() {
            const formatted = (timeOffset >= 0 ? '+' : '') + timeOffset.toFixed(1) + 's';
            document.getElementById('offset-val').innerText = formatted;
            offsetBadge.innerText = formatted;
        }

        // Color Theme Preset
        document.querySelectorAll('.theme-dot').forEach(dot => {
            dot.onclick = () => {
                document.querySelectorAll('.theme-dot').forEach(d => d.classList.remove('active'));
                dot.classList.add('active');
                
                const color = dot.dataset.color;
                const dim = dot.dataset.dim;
                const name = dot.dataset.name;
                
                document.documentElement.style.setProperty('--accent', color);
                document.documentElement.style.setProperty('--accent-glow', dim);
                currentThemeColor = color;
                document.getElementById('theme-tag').innerText = name;
                document.getElementById('theme-tag').style.color = color;
                if (isLooping) loopBtn.style.color = color;
                savePreferences();
            };
        });

        // Speed Selector
        document.querySelectorAll('.speed-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.speed-btn').forEach(b => {
                    b.classList.remove('bg-white/10', 'text-white');
                    b.classList.add('text-white/60');
                });
                btn.classList.add('bg-white/10', 'text-white');
                audio.playbackRate = parseFloat(btn.dataset.speed);
                savePreferences();
            };
        });

        // Visualizer Mode Selector
        document.querySelectorAll('.viz-style-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.viz-style-btn').forEach(b => {
                    b.classList.remove('bg-white/10', 'border', 'border-white/20');
                    b.classList.add('bg-white/5', 'text-white/60');
                });
                btn.classList.add('bg-white/10', 'border', 'border-white/20', 'text-white');
                visualizerMode = btn.dataset.style;
                savePreferences();
            };
        });

        // Reset Settings Button Action
        document.getElementById('reset-settings-btn').onclick = () => {
            localStorage.removeItem('lyrics_flow_preferences');
            applyPreferences(DEFAULT_PREFERENCES);
        };

        // Lyrics Search Logic
        const searchBtn = document.getElementById('search-btn');
        const searchContainer = document.getElementById('search-bar-container');
        const searchInput = document.getElementById('lyrics-search-input');
        const closeSearch = document.getElementById('close-search');

        searchBtn.onclick = () => searchContainer.classList.toggle('hidden');
        closeSearch.onclick = () => searchContainer.classList.add('hidden');

        searchInput.oninput = (e) => {
            const query = e.target.value.toLowerCase().trim();
            const lines = document.querySelectorAll('.preview-line');
            lines.forEach(line => {
                if (query && line.innerText.toLowerCase().includes(query)) {
                    line.style.color = '#facc15';
                    line.style.opacity = '1';
                } else {
                    line.style.color = '';
                    line.style.opacity = '';
                }
            });
        };

        // Slider Progress Logic
        audio.onloadedmetadata = () => document.getElementById('duration-time').innerText = formatTime(audio.duration);
        progressSlider.oninput = (e) => {
            if (audio.duration) {
                audio.currentTime = (e.target.value / 100) * audio.duration;
                updateLyricPosition();
            }
        };

        // Modal Controls & Auto-Play on Apply
        document.getElementById('config-btn').onclick = () => openModal(setupModal);
        document.getElementById('close-modal').onclick = () => closeModal(setupModal);
        
        document.getElementById('apply-btn').onclick = async () => {
            if (lrcTextInput.value.trim() !== '') {
                parseLRC(lrcTextInput.value);
            }

            closeModal(setupModal);
            if (audio.src && audio.paused) {
                await triggerPlay();
            }
        };

        function openModal(modal) {
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
        }

        function closeModal(modal) {
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function closeModals() {
            closeModal(setupModal);
            closeModal(offsetModal);
        }

        // Keyboard Shortcuts
        window.onkeydown = (e) => {
            if (document.activeElement === lrcTextInput || document.activeElement === searchInput) {
                return;
            }

            if (e.code === 'Space') {
                e.preventDefault();
                playPauseBtn.click();
            } else if (e.code === 'ArrowLeft') {
                audio.currentTime = Math.max(0, audio.currentTime - 5);
            } else if (e.code === 'ArrowRight') {
                audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5);
            }
        };

        function formatTime(s) {
            if (isNaN(s)) return "00:00.00";
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            const ms = Math.floor((s % 1) * 100);
            return `${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}.${ms.toString().padStart(2, '0')}`;
        }

        // Initialize Preferences on startup
        loadPreferences();
    </script>
</body>
