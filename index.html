<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lyrics Flow Pro - Studio Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00f2ff;
            --accent-glow: rgba(0, 242, 255, 0.2);
            --bg-base: #030712;
            --card-bg: rgba(15, 23, 42, 0.85);
            --viz-opacity: 0.25;
        }

        html, body {
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-base);
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Ambient Background Grid */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(15, 23, 42, 0.95) 0%, transparent 85%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            z-index: -1;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Dedicated Visualizer Container right above controls */
        #viz-wrapper {
            width: 100%;
            height: 70px;
            pointer-events: none;
            z-index: 25;
            flex-shrink: 0;
            margin-bottom: -15px; /* Subtle overlay effect with the footer line */
            position: relative;
        }

        #p-viz {
            width: 100%;
            height: 100%;
            opacity: var(--viz-opacity);
            transition: opacity 0.4s ease;
        }

        /* Lyrics Viewport Container */
        #p-lyrics-container {
            flex: 1 1 0%;
            min-height: 0;
            width: 100%;
            overflow: hidden;
            position: relative;
            z-index: 10;
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
        }

        #p-lyrics-scroller {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            will-change: transform;
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .preview-line {
            transition: all 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0.25;
            transform: scale(0.88);
            text-align: center;
            margin: 0;
            padding: 16px 24px;
            width: 100%;
            font-size: 1.45rem;
            line-height: 1.4;
            font-weight: 700;
            color: #94a3b8;
            will-change: transform, opacity;
            word-wrap: break-word;
            cursor: pointer;
            border-radius: 16px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .preview-line:hover {
            opacity: 0.6;
            color: #f8fafc;
        }

        @media (min-width: 640px) {
            .preview-line {
                font-size: 2.1rem;
                padding: 22px 40px;
            }
            #viz-wrapper {
                height: 90px;
            }
        }

        .preview-line.active {
            opacity: 1;
            transform: scale(1.08);
            color: var(--accent);
            text-shadow: 0 0 20px var(--accent-glow), 0 4px 15px rgba(0,0,0,0.9);
        }

        /* Glassmorphism Panels */
        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-footer {
            background: rgba(8, 12, 22, 0.94);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px 32px 0 0;
            z-index: 40;
            flex-shrink: 0;
            padding-bottom: max(1.25rem, env(safe-area-inset-bottom));
        }

        /* Buttons */
        .btn-accent {
            background: var(--accent);
            color: #030712;
            box-shadow: 0 0 20px var(--accent-glow);
            transition: all 0.2s ease;
        }

        .btn-accent:active {
            transform: scale(0.92);
        }

        /* Progress Slider */
        .custom-slider {
            -webkit-appearance: none;
            width: 100%;
            background: rgba(255,255,255,0.1);
            height: 6px;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
            transition: height 0.2s;
        }

        .custom-slider:hover {
            height: 8px;
        }

        .custom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 12px var(--accent);
            cursor: pointer;
        }

        /* Spinning Vinyl Record */
        .vinyl-record {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: radial-gradient(circle, #000 30%, #1e293b 31%, #0f172a 60%, #000 100%);
            border: 2px solid rgba(255,255,255,0.12);
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            animation: spin 8s linear infinite;
            animation-play-state: paused;
        }

        .vinyl-record.playing {
            animation-play-state: running;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: opacity 0.3s ease;
        }

        .theme-dot {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            cursor: pointer;
            border: 2.5px solid transparent;
            transition: transform 0.2s, border-color 0.2s;
        }
        .theme-dot.active {
            border-color: #ffffff;
            transform: scale(1.1);
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
    </style>
</head>
<body>

    <div class="bg-grid"></div>

    <!-- Header Area -->
    <header class="p-4 sm:p-6 flex justify-between items-center z-20 flex-shrink-0">
        <div class="flex items-center gap-3">
            <div id="vinyl-art" class="vinyl-record flex items-center justify-center">
                <div class="w-3 h-3 rounded-full bg-white/20"></div>
            </div>
            <div class="space-y-0.5 max-w-[180px] sm:max-w-[300px]">
                <div class="flex items-center gap-2">
                    <span id="theme-tag" class="text-[9px] font-black uppercase tracking-[0.3em] text-white/40">CYBER CYAN</span>
                    <span id="offset-badge" class="text-[9px] mono px-1.5 py-0.5 rounded bg-white/10 text-white/60">0.0s</span>
                </div>
                <h1 id="song-title" class="text-base sm:text-lg font-bold truncate text-white/90">No Track Loaded</h1>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <!-- Search Button -->
            <button id="search-btn" class="w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-white/70 hover:text-white active:scale-90 transition-transform">
                <i class="fa-solid fa-magnifying-glass text-sm"></i>
            </button>
            <!-- Settings Button -->
            <button id="config-btn" class="w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-white/70 hover:text-white active:scale-90 transition-transform">
                <i class="fa-solid fa-sliders text-sm"></i>
            </button>
        </div>
    </header>

    <!-- Search Bar Box -->
    <div id="search-bar-container" class="px-6 hidden z-20 flex-shrink-0 mb-2">
        <div class="glass-panel rounded-xl flex items-center px-3 py-2 border border-white/10">
            <i class="fa-solid fa-search text-white/40 text-xs mr-2"></i>
            <input type="text" id="lyrics-search-input" placeholder="Search lyrics..." class="bg-transparent text-xs text-white outline-none w-full">
            <button id="close-search" class="text-white/40 text-xs px-2"><i class="fa-solid fa-xmark"></i></button>
        </div>
    </div>

    <!-- Lyrics Viewport Area -->
    <main id="p-lyrics-container">
        <div id="p-lyrics-scroller">
            <div class="preview-line">Load audio & lyrics file to start</div>
        </div>
    </main>

    <!-- Dedicated Visualizer Strip (Right on top of controls) -->
    <div id="viz-wrapper">
        <canvas id="p-viz"></canvas>
    </div>

    <!-- Control Footer -->
    <footer class="glass-footer p-4 sm:p-6">
        <div class="max-w-md mx-auto space-y-4">
            <!-- Audio Progress Slider -->
            <div class="space-y-1.5">
                <input type="range" id="progress-slider" class="custom-slider" value="0" step="0.1">
                <div class="flex justify-between text-[10px] font-bold opacity-50 tracking-widest uppercase mono">
                    <span id="current-time">00:00.00</span>
                    <span id="duration-time">00:00.00</span>
                </div>
            </div>

            <!-- Controls Row -->
            <div class="flex items-center justify-between px-2">
                <!-- Loop Track -->
                <button id="loop-btn" class="w-9 h-9 rounded-lg text-white/40 hover:text-white flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-repeat text-sm"></i>
                </button>

                <!-- Rewind 5s -->
                <button id="rewind-btn" class="w-10 h-10 rounded-full text-white/60 hover:text-white active:scale-90 transition-transform flex items-center justify-center">
                    <i class="fa-solid fa-rotate-left text-base"></i>
                </button>
                
                <!-- Play/Pause Button -->
                <button id="play-pause" class="w-16 h-16 sm:w-18 sm:h-18 btn-accent rounded-full flex items-center justify-center shadow-xl active:scale-90 transition-transform">
                    <i id="play-icon" class="fa-solid fa-play text-2xl ml-1"></i>
                    <i id="pause-icon" class="fa-solid fa-pause text-2xl hidden"></i>
                </button>

                <!-- Forward 5s -->
                <button id="forward-btn" class="w-10 h-10 rounded-full text-white/60 hover:text-white active:scale-90 transition-transform flex items-center justify-center">
                    <i class="fa-solid fa-rotate-right text-base"></i>
                </button>

                <!-- Sync Offset Button -->
                <button id="offset-btn" class="w-9 h-9 rounded-lg text-white/40 hover:text-white flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-clock-rotate-left text-sm"></i>
                </button>
            </div>
        </div>
    </footer>

    <!-- Configuration Modal -->
    <div id="setup-modal" class="modal-overlay hidden opacity-0">
        <div class="cyber-panel glass-panel rounded-3xl p-6 w-full max-w-sm space-y-5 shadow-2xl border border-white/10">
            <div class="flex justify-between items-center border-b border-white/10 pb-3">
                <h2 class="text-lg font-extrabold tracking-tight text-white flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-xs text-cyan-400"></i> STUDIO CONTROL
                </h2>
                <button id="close-modal" class="text-white/40 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="space-y-4 text-xs">
                <!-- Demo Song Quick Loader -->
                <button id="demo-load-btn" class="w-full py-2.5 px-3 rounded-xl bg-cyan-500/10 border border-cyan-500/30 text-cyan-300 font-bold hover:bg-cyan-500/20 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Load Demo Song & Lyrics
                </button>

                <!-- Local File Uploads -->
                <div class="space-y-2">
                    <p class="font-bold text-white/40 uppercase tracking-wider text-[9px]">Import Local Media</p>
                    <label class="block cursor-pointer bg-white/5 border border-white/10 p-3 rounded-xl hover:bg-white/10 transition-all">
                        <input type="file" id="audio-input" accept="audio/*" class="hidden">
                        <div class="flex items-center gap-3">
                            <i class="fa-solid fa-music text-white/50"></i>
                            <span id="audio-label" class="font-semibold text-white/80 truncate">Choose Audio File</span>
                        </div>
                    </label>

                    <label class="block cursor-pointer bg-white/5 border border-white/10 p-3 rounded-xl hover:bg-white/10 transition-all">
                        <input type="file" id="lrc-input" accept=".lrc,.txt" class="hidden">
                        <div class="flex items-center gap-3">
                            <i class="fa-solid fa-file-lines text-white/50"></i>
                            <span id="lrc-label" class="font-semibold text-white/80 truncate">Choose LRC Lyrics File</span>
                        </div>
                    </label>
                </div>

                <!-- Visualizer Modes & Opacity Control -->
                <div class="space-y-2">
                    <p class="font-bold text-white/40 uppercase tracking-wider text-[9px]">Visualizer Style</p>
                    <div class="flex gap-2">
                        <button class="viz-style-btn flex-1 py-2 rounded-xl bg-white/10 border border-white/20 text-white font-bold text-[10px]" data-style="bars">SOFT BARS</button>
                        <button class="viz-style-btn flex-1 py-2 rounded-xl bg-white/5 text-white/60 font-bold text-[10px]" data-style="wave">NEON WAVE</button>
                        <button class="viz-style-btn flex-1 py-2 rounded-xl bg-white/5 text-white/60 font-bold text-[10px]" data-style="off">OFF</button>
                    </div>
                </div>

                <!-- Playback Speed -->
                <div class="space-y-2">
                    <p class="font-bold text-white/40 uppercase tracking-wider text-[9px]">Playback Speed</p>
                    <div class="flex justify-between gap-1 bg-white/5 p-1 rounded-xl" id="speed-selector">
                        <button class="speed-btn flex-1 py-1 rounded-lg text-white/60 font-bold hover:text-white" data-speed="0.75">0.75x</button>
                        <button class="speed-btn flex-1 py-1 rounded-lg bg-white/10 text-white font-bold" data-speed="1.0">1.0x</button>
                        <button class="speed-btn flex-1 py-1 rounded-lg text-white/60 font-bold hover:text-white" data-speed="1.25">1.25x</button>
                        <button class="speed-btn flex-1 py-1 rounded-lg text-white/60 font-bold hover:text-white" data-speed="1.5">1.5x</button>
                    </div>
                </div>

                <!-- Color Theme -->
                <div class="space-y-2">
                    <p class="font-bold text-white/40 uppercase tracking-wider text-[9px]">Color Theme Preset</p>
                    <div class="flex justify-between gap-2" id="theme-selector">
                        <div class="theme-dot active" style="background: #00f2ff;" data-color="#00f2ff" data-dim="rgba(0, 242, 255, 0.2)" data-name="CYBER CYAN"></div>
                        <div class="theme-dot" style="background: #a855f7;" data-color="#a855f7" data-dim="rgba(168, 85, 247, 0.2)" data-name="PLASMA PURPLE"></div>
                        <div class="theme-dot" style="background: #f97316;" data-color="#f97316" data-dim="rgba(249, 115, 22, 0.2)" data-name="SUNSET ORANGE"></div>
                        <div class="theme-dot" style="background: #22c55e;" data-color="#22c55e" data-dim="rgba(34, 197, 94, 0.2)" data-name="MATRIX GREEN"></div>
                        <div class="theme-dot" style="background: #ef4444;" data-color="#ef4444" data-dim="rgba(239, 68, 68, 0.2)" data-name="NEON RED"></div>
                    </div>
                </div>
            </div>

            <button id="apply-btn" class="w-full py-3.5 btn-accent font-black rounded-xl uppercase tracking-wider text-xs mt-2">
                Apply Settings
            </button>
        </div>
    </div>

    <!-- Sync Offset Modal -->
    <div id="offset-modal" class="modal-overlay hidden opacity-0">
        <div class="glass-panel rounded-3xl p-6 w-full max-w-xs space-y-4 text-center border border-white/10">
            <h3 class="font-bold text-sm text-white">Adjust Lyric Sync Offset</h3>
            <p class="text-[11px] text-white/50">Shift lyrics earlier or later to match audio perfectly.</p>
            
            <div class="flex items-center justify-center gap-4 py-2">
                <button id="offset-minus" class="w-10 h-10 rounded-xl bg-white/10 text-white font-bold hover:bg-white/20">-0.1s</button>
                <span id="offset-val" class="mono text-lg font-bold text-cyan-400">0.0s</span>
                <button id="offset-plus" class="w-10 h-10 rounded-xl bg-white/10 text-white font-bold hover:bg-white/20">+0.1s</button>
            </div>

            <button id="offset-reset" class="text-xs text-white/40 hover:text-white underline">Reset Offset</button>
            <button id="close-offset" class="w-full py-2.5 bg-white/10 rounded-xl text-xs font-bold text-white mt-2">Done</button>
        </div>
    </div>

    <audio id="audio-player" crossorigin="anonymous"></audio>

    <script>
        // Core Selectors
        const audio = document.getElementById('audio-player');
        const scroller = document.getElementById('p-lyrics-scroller');
        const container = document.getElementById('p-lyrics-container');
        const playPauseBtn = document.getElementById('play-pause');
        const progressSlider = document.getElementById('progress-slider');
        const setupModal = document.getElementById('setup-modal');
        const offsetModal = document.getElementById('offset-modal');
        const canvas = document.getElementById('p-viz');
        const vizWrapper = document.getElementById('viz-wrapper');
        const ctx = canvas.getContext('2d');
        const vinylArt = document.getElementById('vinyl-art');
        const offsetBadge = document.getElementById('offset-badge');

        // State Engine
        let lyrics = [];
        let activeIndex = -1;
        let audioCtx, analyzer, dataArray;
        let currentThemeColor = "#00f2ff";
        let timeOffset = 0.0;
        let isLooping = false;
        let visualizerMode = 'bars';
        
        // Smooth Interpolation Array for Visualizer Bars
        const barCount = 32;
        let smoothBars = new Array(barCount).fill(0);

        // Resize Canvas dynamically inside the Wrapper
        function initCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const rect = vizWrapper.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
        }
        window.onresize = () => {
            initCanvas();
            updateScroll(activeIndex);
        };
        initCanvas();

        // Audio Context Initializer
        async function initAudio() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyzer = audioCtx.createAnalyser();
                const source = audioCtx.createMediaElementSource(audio);
                source.connect(analyzer);
                analyzer.connect(audioCtx.destination);
                analyzer.fftSize = 128;
                dataArray = new Uint8Array(analyzer.frequencyBinCount);
            } catch (e) {
                console.log("AudioContext fallback:", e);
            }
        }

        // Precise Visualizer Engine Anchored Right Above Controls
        function drawViz() {
            requestAnimationFrame(drawViz);
            
            const rect = vizWrapper.getBoundingClientRect();
            const width = rect.width;
            const height = rect.height;

            ctx.clearRect(0, 0, width, height);

            if (visualizerMode === 'off') return;

            let hasRealData = false;
            if (analyzer && !audio.paused) {
                analyzer.getByteFrequencyData(dataArray);
                for(let val of dataArray) {
                    if (val > 0) { hasRealData = true; break; }
                }
            }

            let displayData = new Array(barCount).fill(0);

            if (hasRealData) {
                for(let i = 0; i < barCount; i++) {
                    displayData[i] = dataArray[i] || 0;
                }
            } else if (!audio.paused) {
                const now = Date.now() / 250;
                for (let i = 0; i < barCount; i++) {
                    displayData[i] = (Math.sin(now + i * 0.25) * 0.5 + 0.5) * 140 + 20;
                }
            }

            // Smooth Interpolation
            for(let i = 0; i < barCount; i++) {
                smoothBars[i] += (displayData[i] - smoothBars[i]) * 0.18;
            }

            if (visualizerMode === 'bars') {
                const barWidth = (width / barCount) * 0.55;
                const gap = (width / barCount) * 0.45;

                for (let i = 0; i < barCount; i++) {
                    const h = (smoothBars[i] / 255) * (height * 0.85); // Up to 85% of wrapper height
                    const x = i * (barWidth + gap) + gap / 2;
                    const y = height - h;

                    const grad = ctx.createLinearGradient(0, height, 0, y);
                    grad.addColorStop(0, 'transparent');
                    grad.addColorStop(0.3, currentThemeColor);
                    grad.addColorStop(1, '#ffffff');

                    ctx.fillStyle = grad;
                    ctx.globalAlpha = 0.9;
                    
                    ctx.beginPath();
                    ctx.roundRect(x, y, barWidth, h, [4, 4, 0, 0]);
                    ctx.fill();
                }
            } 
            else if (visualizerMode === 'wave') {
                ctx.beginPath();
                ctx.lineWidth = 3;
                ctx.strokeStyle = currentThemeColor;
                ctx.globalAlpha = 0.9;

                const sliceWidth = width / (barCount - 1);
                let x = 0;

                for (let i = 0; i < barCount; i++) {
                    const v = smoothBars[i] / 255.0;
                    const y = height - (v * height * 0.75) - 5;

                    if (i === 0) ctx.moveTo(x, y);
                    else {
                        const prevX = x - sliceWidth;
                        const prevY = height - ((smoothBars[i-1] / 255.0) * height * 0.75) - 5;
                        const xc = (prevX + x) / 2;
                        const yc = (prevY + y) / 2;
                        ctx.quadraticCurveTo(prevX, prevY, xc, yc);
                    }
                    x += sliceWidth;
                }
                ctx.stroke();

                ctx.lineTo(width, height);
                ctx.lineTo(0, height);
                const waveGrad = ctx.createLinearGradient(0, 0, 0, height);
                waveGrad.addColorStop(0, currentThemeColor);
                waveGrad.addColorStop(1, 'transparent');
                ctx.fillStyle = waveGrad;
                ctx.globalAlpha = 0.2;
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }
        drawViz();

        // LRC Parsing Engine
        function parseLRC(text) {
            lyrics = [];
            if (!text) return;

            const cleanText = text.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            const lines = cleanText.split('\n');
            const timestampRegex = /[\[<\(]\s*(\d{1,3})\s*:\s*(\d{1,2})(?:\s*[\.\:,]\s*(\d{1,3}))?\s*[\]>\)]/g;

            lines.forEach((line) => {
                if (/^\s*[\[<\(]\s*(ar|ti|al|by|offset|length)\s*:/i.test(line)) return;

                const matches = [...line.matchAll(timestampRegex)];
                if (matches.length > 0) {
                    let content = line.replace(timestampRegex, '').trim();
                    if (!content) content = "♪ ♪ ♪";

                    matches.forEach(match => {
                        const min = parseInt(match[1], 10);
                        const sec = parseInt(match[2], 10);
                        let ms = 0;
                        if (match[3]) {
                            const rawMs = match[3];
                            if (rawMs.length === 1) ms = parseInt(rawMs, 10) * 100;
                            else if (rawMs.length === 2) ms = parseInt(rawMs, 10) * 10;
                            else ms = parseInt(rawMs, 10);
                        }
                        const time = min * 60 + sec + ms / 1000;
                        lyrics.push({ time, content });
                    });
                }
            });

            lyrics.sort((a, b) => a.time - b.time);
            renderPreview();
        }

        function renderPreview() {
            scroller.innerHTML = '';
            if (lyrics.length === 0) {
                scroller.innerHTML = '<div class="preview-line">No lyrics available</div>';
                updateScroll(-1);
                return;
            }

            lyrics.forEach((l, i) => {
                const div = document.createElement('div');
                div.className = 'preview-line';
                div.id = `line-${i}`;
                div.innerText = l.content;
                
                div.onclick = () => {
                    audio.currentTime = Math.max(0, l.time + timeOffset);
                    if (audio.paused) audio.play();
                };

                scroller.appendChild(div);
            });
            activeIndex = -1;
            updateScroll(-1);
        }

        // High precision 60FPS Lyric Sync Loop
        function syncLyricLoop() {
            if (!audio.paused && !audio.ended) {
                updateLyricPosition();
            }
            requestAnimationFrame(syncLyricLoop);
        }
        requestAnimationFrame(syncLyricLoop);

        function updateLyricPosition() {
            const cur = audio.currentTime;
            document.getElementById('current-time').innerText = formatTime(cur);
            if (audio.duration) {
                progressSlider.value = (cur / audio.duration) * 100;
            }

            const adjustedTime = cur - timeOffset;

            let idx = -1;
            for (let i = 0; i < lyrics.length; i++) {
                if (adjustedTime >= lyrics[i].time - 0.08) {
                    idx = i;
                } else {
                    break;
                }
            }

            if (idx !== activeIndex) {
                activeIndex = idx;
                updateScroll(idx);
            }
        }

        function updateScroll(idx) {
            const lines = document.querySelectorAll('.preview-line');
            lines.forEach(el => el.classList.remove('active'));

            const containerHeight = container.offsetHeight;

            if (idx === -1 || !lines.length) {
                scroller.style.transform = `translateY(${containerHeight / 2}px)`;
                return;
            }

            const target = document.getElementById(`line-${idx}`);
            if (target) {
                target.classList.add('active');
                const offset = (containerHeight / 2) - (target.offsetTop + target.offsetHeight / 2);
                scroller.style.transform = `translateY(${offset}px)`;
            }
        }

        // File Input Listeners
        document.getElementById('audio-input').onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                audio.src = URL.createObjectURL(file);
                document.getElementById('song-title').innerText = file.name.replace(/\.[^/.]+$/, "");
                document.getElementById('audio-label').innerText = "✓ " + file.name;
            }
        };

        document.getElementById('lrc-input').onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => parseLRC(ev.target.result);
                reader.readAsText(file);
                document.getElementById('lrc-label').innerText = "✓ " + file.name;
            }
        };

        // Demo Track Loader
        document.getElementById('demo-load-btn').onclick = () => {
            audio.src = "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3";
            document.getElementById('song-title').innerText = "Cyber Lofi Chill (Demo)";
            
            const demoLRC = `
[00:00.00] ♪ Soft Ambient Intro ♪
[00:05.00] Welcome to Lyrics Flow Pro Studio
[00:09.50] High precision lyric synchronization
[00:14.00] Elegant and clear typography
[00:19.00] Visualizer anchored right on top of controls
[00:24.00] Optimized for mobile & desktop screens
[00:30.00] ♪ Instrumental Bridge ♪
[00:36.00] Enjoy your music experience!
            `;
            parseLRC(demoLRC);
            closeModals();
            initAudio();
            audio.play();
        };

        // Player Actions
        playPauseBtn.onclick = () => {
            if (!audio.src) {
                openModal(setupModal);
                return;
            }
            if (audio.paused) {
                initAudio();
                audio.play();
            } else {
                audio.pause();
            }
        };

        audio.onplay = () => {
            document.getElementById('play-icon').classList.add('hidden');
            document.getElementById('pause-icon').classList.remove('hidden');
            vinylArt.classList.add('playing');
        };

        audio.onpause = () => {
            document.getElementById('play-icon').classList.remove('hidden');
            document.getElementById('pause-icon').classList.add('hidden');
            vinylArt.classList.remove('playing');
        };

        document.getElementById('rewind-btn').onclick = () => audio.currentTime = Math.max(0, audio.currentTime - 5);
        document.getElementById('forward-btn').onclick = () => audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5);

        // Loop Button
        const loopBtn = document.getElementById('loop-btn');
        loopBtn.onclick = () => {
            isLooping = !isLooping;
            audio.loop = isLooping;
            loopBtn.style.color = isLooping ? currentThemeColor : 'rgba(255,255,255,0.4)';
        };

        // Sync Offset Controls
        document.getElementById('offset-btn').onclick = () => openModal(offsetModal);
        document.getElementById('close-offset').onclick = () => closeModal(offsetModal);

        document.getElementById('offset-plus').onclick = () => adjustOffset(0.1);
        document.getElementById('offset-minus').onclick = () => adjustOffset(-0.1);
        document.getElementById('offset-reset').onclick = () => {
            timeOffset = 0.0;
            updateOffsetUI();
        };

        function adjustOffset(val) {
            timeOffset += val;
            updateOffsetUI();
        }

        function updateOffsetUI() {
            const formatted = (timeOffset >= 0 ? '+' : '') + timeOffset.toFixed(1) + 's';
            document.getElementById('offset-val').innerText = formatted;
            offsetBadge.innerText = formatted;
        }

        // Color Theme Preset
        document.querySelectorAll('.theme-dot').forEach(dot => {
            dot.onclick = () => {
                document.querySelectorAll('.theme-dot').forEach(d => d.classList.remove('active'));
                dot.classList.add('active');
                
                const color = dot.dataset.color;
                const dim = dot.dataset.dim;
                const name = dot.dataset.name;
                
                document.documentElement.style.setProperty('--accent', color);
                document.documentElement.style.setProperty('--accent-glow', dim);
                currentThemeColor = color;
                document.getElementById('theme-tag').innerText = name;
                document.getElementById('theme-tag').style.color = color;
                if (isLooping) loopBtn.style.color = color;
            };
        });

        // Speed Selector
        document.querySelectorAll('.speed-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.speed-btn').forEach(b => {
                    b.classList.remove('bg-white/10', 'text-white');
                    b.classList.add('text-white/60');
                });
                btn.classList.add('bg-white/10', 'text-white');
                audio.playbackRate = parseFloat(btn.dataset.speed);
            };
        });

        // Visualizer Mode Selector
        document.querySelectorAll('.viz-style-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.viz-style-btn').forEach(b => {
                    b.classList.remove('bg-white/10', 'border', 'border-white/20');
                    b.classList.add('bg-white/5', 'text-white/60');
                });
                btn.classList.add('bg-white/10', 'border', 'border-white/20', 'text-white');
                visualizerMode = btn.dataset.style;
            };
        });

        // Lyrics Search Logic
        const searchBtn = document.getElementById('search-btn');
        const searchContainer = document.getElementById('search-bar-container');
        const searchInput = document.getElementById('lyrics-search-input');
        const closeSearch = document.getElementById('close-search');

        searchBtn.onclick = () => searchContainer.classList.toggle('hidden');
        closeSearch.onclick = () => searchContainer.classList.add('hidden');

        searchInput.oninput = (e) => {
            const query = e.target.value.toLowerCase().trim();
            const lines = document.querySelectorAll('.preview-line');
            lines.forEach(line => {
                if (query && line.innerText.toLowerCase().includes(query)) {
                    line.style.color = '#facc15';
                    line.style.opacity = '1';
                } else {
                    line.style.color = '';
                    line.style.opacity = '';
                }
            });
        };

        // Slider Progress Logic
        audio.onloadedmetadata = () => document.getElementById('duration-time').innerText = formatTime(audio.duration);
        progressSlider.oninput = (e) => {
            if (audio.duration) {
                audio.currentTime = (e.target.value / 100) * audio.duration;
                updateLyricPosition();
            }
        };

        // Modal Controls
        document.getElementById('config-btn').onclick = () => openModal(setupModal);
        document.getElementById('close-modal').onclick = () => closeModal(setupModal);
        document.getElementById('apply-btn').onclick = () => closeModal(setupModal);

        function openModal(modal) {
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
        }

        function closeModal(modal) {
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function closeModals() {
            closeModal(setupModal);
            closeModal(offsetModal);
        }

        // Keyboard Shortcuts
        window.onkeydown = (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                playPauseBtn.click();
            } else if (e.code === 'ArrowLeft') {
                audio.currentTime = Math.max(0, audio.currentTime - 5);
            } else if (e.code === 'ArrowRight') {
                audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5);
            }
        };

        function formatTime(s) {
            if (isNaN(s)) return "00:00.00";
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            const ms = Math.floor((s % 1) * 100);
            return `${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}.${ms.toString().padStart(2, '0')}`;
        }
    </script>
</body>
</html>
